# Calibration v2 quant and 4.05 on turboderp's qbench trace against BF16 (4.05 results come from the cache)
title: Qwen3.8-Flash-Next, turboderp qbench trace, BF16 reference

test_trace: qbench_prompts_turboderp.json

logit_cache:
  dir: _logit_cache/
  max_size_gb: 40

noise_floor: true

models:
  - label: BF16 (reference)
    group: reference
    engine: exllamav3
    source: /home/daniil/lm-inference/models/Qwen3.8-Flash-Next/BF16

  - label: SC 4.00 v2 calibration (ours)
    group: SC v2
    engine: exllamav3
    source: /home/daniil/lm-inference/models/Qwen3.8-Flash-Next/SC-EXL3-4.00-v2

  - label: 4.05 bpw (turboderp)
    group: EXL3 plain
    engine: exllamav3
    source: /home/daniil/lm-inference/models/Qwen3.8-Flash-Next/EXL3-4.05

output:
  results: qb_bf16_v2_results.json
  plot_kld: qb_bf16_v2_kld.png
  plot_kld_spread: qb_bf16_v2_kld_spread.png
