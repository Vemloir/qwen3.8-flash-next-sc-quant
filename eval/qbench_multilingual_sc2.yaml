# SC2 (calibration set 2) and SC v3 (set 1, published), both 4.05 bpw, against BF16 on a multilingual teacher-forced trace: Russian (GrandMaster prompts,
# Qwen3-235B answers) and 9 more languages (Nemotron-SFT-Multilingual translated answers); no overlap with calibration
title: Qwen3.8-Flash-Next, multilingual conversations (ru + 9 languages, teacher-forced), BF16 reference

test_trace: multilingual_trace.json

logit_cache:
  dir: _logit_cache/
  max_size_gb: 40

noise_floor: false

# long agent rows: the head only sees positions from the first scored token on
crop_logits: true

models:
  - label: BF16 (reference)
    group: reference
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/BF16

  # local copy deleted on 2026-10-18; to rerun, download revision 524a19ebbbd653cd8cf31b766a56e7183133d7a0 of
  # Vemloir/Qwen3.8-Flash-Next-sc-exl3 (branch 4.05bpw_sc_h8_ng8) to this path
  - label: SC 4.05 v3 (ours)
    group: SC v3
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/SC-EXL3-4.05-v3

  - label: SC2 4.05 (calibration set 2)
    group: SC2
    engine: exllamav3
    source: /home/daniil/lm-inference/models/Qwen3.8-Flash-Next/SC2-EXL3-4.05

output:
  results: qb_multilingual_sc2_results.json
  plot_kld: qb_multilingual_sc2_kld.png
  plot_kld_spread: qb_multilingual_sc2_kld_spread.png
