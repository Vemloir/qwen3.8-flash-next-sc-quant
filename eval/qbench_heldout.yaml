# Calibration v1 quant (from BF16) and 4.05 on the held-out part of the trace pool (all reasoning modes,
# chat and agent steps not used by calibration v2), against BF16. Run before v1 is deleted locally
title: Qwen3.8-Flash-Next, held-out trace pool, BF16 reference

test_trace: heldout_trace.json

logit_cache:
  dir: _logit_cache/
  max_size_gb: 40

noise_floor: false

models:
  - label: BF16 (reference)
    group: reference
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/BF16

  - label: SC 4.00 v1 calibration (ours)
    group: SC v1
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/SC-EXL3-4.00-bf16src

  - label: 4.05 bpw (turboderp)
    group: EXL3 plain
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/EXL3-4.05

output:
  results: qb_heldout_results.json
  plot_kld: qb_heldout_kld.png
  plot_kld_spread: qb_heldout_kld_spread.png
