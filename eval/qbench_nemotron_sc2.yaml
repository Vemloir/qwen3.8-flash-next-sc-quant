# SC2 (calibration set 2) and SC v3 (set 1, published), both 4.05 bpw, against BF16 on a teacher-forced trace from NVIDIA's Nemotron 3.5 Super
# post-training data (no overlap with the MiMo tasks behind calibration and the earlier evaluation traces)
title: Qwen3.8-Flash-Next, Nemotron post-training conversations (teacher-forced), BF16 reference

test_trace: nemotron_trace.json

logit_cache:
  dir: _logit_cache/
  max_size_gb: 40

noise_floor: false

# long agent rows: the head only sees positions from the first scored token on
crop_logits: true

models:
  - label: BF16 (reference)
    group: reference
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/BF16

  - label: SC 4.05 v3 (ours)
    group: SC v3
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/SC-EXL3-4.05-v3

  - label: SC2 4.05 (calibration set 2)
    group: SC2
    engine: exllamav3
    source: /home/daniil/lm-inference/models/Qwen3.8-Flash-Next/SC2-EXL3-4.05

output:
  results: qb_nemotron_sc2_results.json
  plot_kld: qb_nemotron_sc2_kld.png
  plot_kld_spread: qb_nemotron_sc2_kld_spread.png
