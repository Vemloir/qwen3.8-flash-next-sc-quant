# FP8 checkpoint vs BF16 checkpoint on turboderp's qbench trace. The FP8 checkpoint was deleted to
# make room for BF16, but its logits are still cached from the earlier run: they serve as the
# reference (cached_key), and BF16 runs as the test model, giving KLD(p_FP8 || p_BF16)
title: Qwen3.8-Flash-Next, FP8 vs BF16 checkpoint

test_trace: qbench_prompts_turboderp.json

logit_cache:
  dir: _logit_cache/
  max_size_gb: 40

noise_floor: false

models:
  - label: FP8 + BF16 n-gram (cached logits)
    group: reference
    engine: exllamav3
    source: /home/daniil/lm-inference/models/Qwen3.8-Flash-Next/FP8
    cached_key: a902cd745d29fc3d

  - label: BF16
    group: BF16
    engine: exllamav3
    source: /home/daniil/lm-inference/models/Qwen3.8-Flash-Next/BF16

output:
  results: qb_fp8_vs_bf16.json
