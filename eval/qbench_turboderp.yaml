# KLD/PPL of our SC quant vs turboderp's 4.05 on turboderp's own qbench trace (shipped with his
# 4.05 quant: 22 rows, ~60k tokens, sampled from his 6.00 bpw quant, reasoning_effort medium),
# against the FP8 checkpoint with the BF16 n-gram table as reference
title: Qwen3.8-Flash-Next, turboderp qbench trace

test_trace: qbench_prompts_turboderp.json

logit_cache:
  dir: _logit_cache/
  max_size_gb: 40

models:
  - label: FP8 + BF16 n-gram (reference)
    group: reference
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/FP8

  - label: SC 4.00 bpw (ours)
    group: SC (ours)
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/SC-EXL3-4.00

  - label: 4.05 bpw (turboderp)
    group: EXL3 plain
    engine: exllamav3
    source: ~/lm-inference/models/Qwen3.8-Flash-Next/EXL3-4.05

output:
  plot_kld: qb_kld.png
  plot_ppl: qb_ppl.png
  plot_kld_spread: qb_kld_spread.png
  results: qb_results.json
  plot_kld_hist: qb_kld_hist.png
  plot_kld_hist_combined:
    file: qb_kld_hist_combined.png
    x_log: true
    y_log: false
